name: Offline application checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install isolation runtime
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - name: Install dependency wheels from PyPI
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/ttm-api-venv"
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib
          metadata = tomllib.loads(Path('services/api/pyproject.toml').read_text())
          requirements = metadata['project']['dependencies'] + metadata['project']['optional-dependencies']['dev']
          Path(os.environ['RUNNER_TEMP'], 'ttm-requirements.txt').write_text('\n'.join(requirements) + '\n')
          PY
          "$RUNNER_TEMP/ttm-api-venv/bin/python" -m pip install --index-url https://pypi.org/simple --only-binary=:all: -r "$RUNNER_TEMP/ttm-requirements.txt"
      # Privilege is used only for namespace setup; the test child drops all capabilities.
      - name: Run exactly 269 synthetic or mocked API cases offline
        run: sudo -n -- env LD_LIBRARY_PATH="$pythonLocation/lib" "$(command -v python)" scripts/checks-offline.py api --python-venv "$RUNNER_TEMP/ttm-api-venv"

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install isolation runtime
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - name: Install npm dependencies without lifecycle scripts
        working-directory: apps/web-next
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org --no-audit --no-fund
      # The test child retains no capabilities and has no network.
      - name: Check types and build offline
        run: sudo -n -- /usr/bin/python3 scripts/checks-offline.py web --node "$(command -v node)" --node-modules "$GITHUB_WORKSPACE/apps/web-next/node_modules"
